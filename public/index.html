<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mo's Journal 📒</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="stylesheet" href="styles.css?v=4.6.9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<div id="stickyHead">
<header id="topbar">
  <div class="brand">
    <span class="brand-emoji">📒</span>
    <div>
      <div class="brand-name">Mo's Journal</div>
      <div class="brand-tag">Trade. Reflect. Level up. · 🧠 SMART v4.6.9 — TIME MACHINE</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="chip streak-chip" id="streakChip" title="Journaling streak">🔥 <span id="streakVal">0</span></div>
    <div class="level-wrap" id="levelWrap" title="Your trader level">
      <div class="level-row"><span id="levelEmoji">🌱</span><span id="levelName">Demo Dreamer</span></div>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
      <div class="xp-text" id="xpText">0 XP</div>
    </div>
  </div>
</header>
<div id="profileBar" class="pbar"></div>
</div>

<main id="main">
  <section id="page-dashboard" class="page"></section>
  <section id="page-journal" class="page hidden"></section>
  <section id="page-gallery" class="page hidden"></section>
  <section id="page-analytics" class="page hidden"></section>
  <section id="page-calendar" class="page hidden"></section>
  <section id="page-settings" class="page hidden"></section>
</main>

<nav id="navbar">
  <button class="nav-btn" data-page="dashboard"><span class="nav-ico">🏠</span><span class="nav-lbl">Home</span></button>
  <button class="nav-btn" data-page="analytics"><span class="nav-ico">📊</span><span class="nav-lbl">Stats</span></button>
  <button class="nav-btn" data-page="gallery"><span class="nav-ico">🖼️</span><span class="nav-lbl">Charts</span></button>
  <button class="nav-btn nav-add" id="navAdd" title="Log a trade"><span class="nav-add-ico">＋</span></button>
  <button class="nav-btn" data-page="journal"><span class="nav-ico">📓</span><span class="nav-lbl">Log</span></button>
  <button class="nav-btn" data-page="calendar"><span class="nav-ico">📅</span><span class="nav-lbl">Cal</span></button>
  <button class="nav-btn" data-page="settings"><span class="nav-ico">⚙️</span><span class="nav-lbl">More</span></button>
</nav>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<canvas id="confetti"></canvas>

<script src="parse.js?v=4.6.9"></script>
<script src="app.js?v=4.6.9"></script>
</body>
</html>
